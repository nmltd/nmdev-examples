name: Documentation
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'benchmark/site/**'
      - 'benchmark/scripts/**'
      - 'benchmark/results/**'
      - 'scripts/**'
      - 'src/main/java/dev/nm/examples/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'benchmark/**'
      - 'scripts/**'
      - 'src/main/java/dev/nm/examples/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-docs.txt
      - name: Install documentation renderer
        run: python -m pip install -r scripts/requirements-docs.txt
      - name: Build from Markdown and saved benchmark measurements
        run: python benchmark/scripts/publish-pages.py benchmark/results/2026-10-18-expanded
      - name: Check links and navigation
        run: python scripts/check-site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
