name: Benchmark application
on:
  push:
    branches: [main]
    paths:
      - 'benchmark/pom.xml'
      - 'benchmark/launcher/**'
      - 'benchmark/src/main/java/**'
      - 'benchmark/dependencies.lock.tsv'
      - '.github/workflows/benchmark-application.yml'
  pull_request:
    paths:
      - 'benchmark/pom.xml'
      - 'benchmark/launcher/**'
      - 'benchmark/src/main/java/**'
      - 'benchmark/dependencies.lock.tsv'
      - '.github/workflows/benchmark-application.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check PowerShell entrypoint syntax
        shell: pwsh
        run: '[scriptblock]::Create([IO.File]::ReadAllText("benchmark/run-benchmark.ps1")) | Out-Null'
      - name: Build application and test checkpoint/ZIP safeguards
        run: mvn -B -f benchmark/pom.xml package
      - name: Verify automatic preparation and all library/profile adapters
        run: java -Xmx2g -jar benchmark/target/nmdev-benchmark-1.3.0.jar --smoke --output smoke-results
      - name: Verify arbitrary local NMDEV filename and recorded binary origin
        shell: pwsh
        run: |
          Copy-Item smoke-results/.runtime/lib/nmdev-selected.jar 'selected NMDEV.jar'
          java -Xmx2g -jar benchmark/target/nmdev-benchmark-1.3.0.jar --nmdev-jar 'selected NMDEV.jar' --smoke --libraries 'NMDEV,COMMONS,COMMONS_BLOCK' --max-cases 1 --output local-jar-results
          if ($LASTEXITCODE -ne 0) { throw 'Local-JAR smoke failed' }
          $expected = (Get-FileHash 'selected NMDEV.jar' -Algorithm SHA256).Hash.ToLowerInvariant()
          $recorded = Get-Content local-jar-results/binary-provenance.json -Raw | ConvertFrom-Json
          if ($recorded.nmdev_sha256 -ne $expected -or $recorded.nmdev_original_filename -ne 'selected NMDEV.jar') { throw 'Wrong NMDEV binary provenance' }
      - name: Verify saved forks are reused
        run: java -Xmx2g -jar benchmark/target/nmdev-benchmark-1.3.0.jar --smoke --output smoke-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke-${{ matrix.os }}
          path: smoke-results-results-*.zip
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04' && success()
        with:
          name: nmdev-benchmark-application
          path: benchmark/target/nmdev-benchmark-1.3.0.jar

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nmdev-benchmark-application
          path: release
      - name: Publish verified reusable application
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum nmdev-benchmark-1.3.0.jar > SHA256SUMS
          gh release create benchmark-v1.3.0 nmdev-benchmark-1.3.0.jar SHA256SUMS ../benchmark/run-benchmark.ps1 --repo nmltd/nmdev-examples --target "$GITHUB_SHA" --title 'Reusable benchmark application 1.3.0' --notes 'Select any NMDEV binary with --nmdev-jar. Full 1,260-case suite across eleven libraries including both Commons matrix implementations. Released checksum-pinned Commons Math 4.0-beta1 dependencies. Windows and Linux application smoke, local-JAR selection and resume checks passed for this exact application build. Full benchmark timings are run locally.'
