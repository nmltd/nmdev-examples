name: Benchmark application
on:
  push:
    branches: [main]
    paths:
      - 'benchmark/pom.xml'
      - 'benchmark/launcher/**'
      - 'benchmark/src/main/java/**'
      - 'benchmark/dependencies.lock.tsv'
      - '.github/workflows/benchmark-application.yml'
  pull_request:
    paths:
      - 'benchmark/pom.xml'
      - 'benchmark/launcher/**'
      - 'benchmark/src/main/java/**'
      - 'benchmark/dependencies.lock.tsv'
      - '.github/workflows/benchmark-application.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build application and test checkpoint/ZIP safeguards
        run: mvn -B -f benchmark/pom.xml package
      - name: Verify automatic preparation and all library/profile adapters
        run: java -Xmx2g -jar benchmark/target/nmdev-benchmark-1.2.0.jar --smoke --output smoke-results
      - name: Verify saved forks are reused
        run: java -Xmx2g -jar benchmark/target/nmdev-benchmark-1.2.0.jar --smoke --output smoke-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke-${{ matrix.os }}
          path: smoke-results-results.zip
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04' && success()
        with:
          name: nmdev-benchmark-application
          path: benchmark/target/nmdev-benchmark-1.2.0.jar
